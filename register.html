<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E1624">
    <title>Register - Hadiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Italiana&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>

        .auth { display: flex; justify-content: center; padding: 34px 20px 10px; }
        .container { width: 100%; max-width: 470px; padding: 34px 32px 30px; border-radius: 28px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 25px 60px rgba(70, 40, 20, 0.2); }
        .container .brand { display: flex; justify-content: center; margin-bottom: 8px; }
        .top-row { display: flex; justify-content: flex-end; margin-bottom: 6px; }
        h1 { text-align: center; font-size: 2.6rem; }
        .subtitle { margin: 6px 0 22px; text-align: center; color: var(--muted); }
        form label { margin-top: 15px; }
        select { margin-bottom: 4px; }
        button[type="submit"] { width: 100%; margin-top: 24px; }
        #message { display: none; margin-top: 18px; padding: 12px; border-radius: 12px; text-align: center; line-height: 1.4; font-weight: 700; }
        #message.success { display: block; background: #CFD8B2; color: #2F4A1A; }
        #message.error { display: block; background: #E6C3C3; color: var(--wine); }
        .login-link { margin-top: 20px; text-align: center; color: var(--muted); }
        .login-link a { color: var(--wine); font-weight: 800; }
        html[dir="rtl"] label, html[dir="rtl"] input { text-align: right; }

    </style>
</head>
<body>
  <div class="awning"></div>
  <div class="auth">
  <main class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/></svg></span>
      <span class="brand-name">Hadiya</span>
    </a>
    <div class="top-row">
      <button type="button" id="languageButton" class="lang-btn">العربية</button>
    </div>
    <h1 id="pageTitle">Create Account</h1>
    <p class="subtitle" id="pageSubtitle">Register for your Hadiya account</p>

    <form id="registerForm">
      <label for="name" id="nameLabel">Full name</label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      />

      <label for="email" id="emailLabel">Email address</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />

      <label for="phone" id="phoneLabel">Phone number</label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      />

      <label for="password" id="passwordLabel">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter a password"
        minlength="6"
        required
      />

      <label for="role" id="roleLabel">I want to</label>

      <select id="role" name="role">
        <option value="customer" id="roleCustomer">Wrap my gifts (customer)</option>
        <option value="shop_owner" id="roleShop">Offer wrapping services (shop owner)</option>
      </select>

      <button type="submit" class="btn" id="registerButton">
        Register
      </button>
    </form>

    <div id="message"></div>

    <p class="login-link">
      <span id="loginQuestion">Already have an account?</span>
      <a href="login.html" id="loginLink">Log in</a>
    </p>
  </main>
  </div>
  <div class="trees" aria-hidden="true" style="margin-top:30px"></div>

  <script src="config.js"></script>
  <script>
    const translations = {
      en: {
        pageTitle: "Create Account",
        pageSubtitle: "Register for your Hadiya account",
        nameLabel: "Full name",
        namePlaceholder: "Enter your full name",
        emailLabel: "Email address",
        emailPlaceholder: "Enter your email",
        phoneLabel: "Phone number",
        phonePlaceholder: "Enter your phone number",
        passwordLabel: "Password",
        passwordPlaceholder: "Enter a password",
        roleLabel: "I want to",
        roleCustomer: "Wrap my gifts (customer)",
        roleShop: "Offer wrapping services (shop owner)",
        registerButton: "Register",
        registeringButton: "Registering...",
        loginQuestion: "Already have an account?",
        loginLink: "Log in",
        languageButton: "العربية",
        incompleteFields: "Please complete all fields.",
        successMessage: "Registration successful. You can now log in.",
        defaultError: "Registration failed. Please try again."
      },

      ar: {
        pageTitle: "إنشاء حساب",
        pageSubtitle: "سجّل حسابك في هدية",
        nameLabel: "الاسم الكامل",
        namePlaceholder: "أدخل اسمك الكامل",
        emailLabel: "البريد الإلكتروني",
        emailPlaceholder: "أدخل بريدك الإلكتروني",
        phoneLabel: "رقم الهاتف",
        phonePlaceholder: "أدخل رقم هاتفك",
        passwordLabel: "كلمة المرور",
        passwordPlaceholder: "أدخل كلمة المرور",
        roleLabel: "أريد أن",
        roleCustomer: "أغلّف هداياي (عميل)",
        roleShop: "أقدّم خدمات التغليف (صاحب متجر)",
        registerButton: "تسجيل",
        registeringButton: "جارٍ التسجيل...",
        loginQuestion: "لديك حساب بالفعل؟",
        loginLink: "تسجيل الدخول",
        languageButton: "English",
        incompleteFields: "يرجى إكمال جميع الحقول.",
        successMessage: "تم التسجيل بنجاح. يمكنك الآن تسجيل الدخول.",
        defaultError: "فشل التسجيل. يرجى المحاولة مرة أخرى."
      }
    };

    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const languageButton = document.getElementById("languageButton");
    const message = document.getElementById("message");

    let currentLanguage = localStorage.getItem("language") || "en";

    function applyLanguage() {
      const language = translations[currentLanguage];

      document.documentElement.lang = currentLanguage;
      document.documentElement.dir =
        currentLanguage === "ar" ? "rtl" : "ltr";
      document.body.classList.toggle("arabic", currentLanguage === "ar");

      document.title =
        currentLanguage === "ar"
          ? "تسجيل - هدية"
          : "Register - Hadiya";

      document.getElementById("pageTitle").textContent =
        language.pageTitle;

      document.getElementById("pageSubtitle").textContent =
        language.pageSubtitle;

      document.getElementById("nameLabel").textContent =
        language.nameLabel;

      document.getElementById("name").placeholder =
        language.namePlaceholder;

      document.getElementById("emailLabel").textContent =
        language.emailLabel;

      document.getElementById("email").placeholder =
        language.emailPlaceholder;

      document.getElementById("phoneLabel").textContent =
        language.phoneLabel;

      document.getElementById("phone").placeholder =
        language.phonePlaceholder;

      document.getElementById("passwordLabel").textContent =
        language.passwordLabel;

      document.getElementById("password").placeholder =
        language.passwordPlaceholder;

      document.getElementById("roleLabel").textContent = language.roleLabel;
      document.getElementById("roleCustomer").textContent = language.roleCustomer;
      document.getElementById("roleShop").textContent = language.roleShop;

      document.getElementById("loginQuestion").textContent =
        language.loginQuestion;

      document.getElementById("loginLink").textContent =
        language.loginLink;

      languageButton.textContent =
        language.languageButton;

      if (!registerButton.disabled) {
        registerButton.textContent =
          language.registerButton;
      }
    }

    languageButton.addEventListener("click", function () {
      currentLanguage = currentLanguage === "en" ? "ar" : "en";

      localStorage.setItem("language", currentLanguage);

      applyLanguage();
    });

    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const language = translations[currentLanguage];

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;

      message.className = "";
      message.textContent = "";

      if (!name || !email || !phone || !password) {
        message.textContent = language.incompleteFields;
        message.className = "error";
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = language.registeringButton;

      try {
        const response = await fetch(
          API_URL + "/auth/register",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              name: name,
              email: email,
              phone: phone,
              password: password,
              role: document.getElementById("role").value
            })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            `Registration failed. Server status: ${response.status}`
          );
        }

        message.textContent = language.successMessage;
        message.className = "success";

        registerForm.reset();

        setTimeout(function () {
          window.location.href = "login.html";
        }, 2000);

      } catch (error) {
        console.error("Registration error:", error);

        message.textContent =
          error.message || language.defaultError;

        message.className = "error";

      } finally {
        registerButton.disabled = false;
        registerButton.textContent =
          translations[currentLanguage].registerButton;
      }
    });

    applyLanguage();
  </script>
</body>
</html>
