<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E1624">
    <title>Shop Orders - Hadiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Italiana&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>

        .page-actions { margin-top: 16px; }
        .login-link { display: inline-block; margin-bottom: 20px; }
        .order-card h2 { font-size: 1.7rem; margin-bottom: 6px; color: var(--head); overflow-wrap: anywhere; }
        .order-card p { line-height: 1.55; color: var(--ink-2); overflow-wrap: anywhere; }
        .empty-state { background: var(--card); border: 1px dashed var(--line); border-radius: 18px; padding: 30px; text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 16px; }
        .status-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        .status-select { width: auto; min-width: 200px; padding: 10px 14px; border-radius: 999px; }
        .btn-update { padding: 10px 22px; border: 0; border-radius: 999px; background: var(--wine); color: var(--on-wine); font: inherit; font-weight: 700; cursor: pointer; }
        .btn-update:hover { background: var(--wine-d); }
        button:disabled, select:disabled { opacity: 0.6; cursor: not-allowed; }
        @media (max-width: 600px) { .status-controls { align-items: stretch; flex-direction: column; } .status-select { width: 100%; } }

    </style>
</head>
<body>
    <div class="awning"></div>
    <div class="wrap">
        <header class="topbar">
            <a href="index.html" class="brand">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/></svg></span>
                <span class="brand-name">Hadiya</span>
            </a>
            <nav class="nav" id="siteNav"></nav>
        </header>

        <main style="max-width:1000px">
            <div class="page-head">
                <div class="script">incoming orders</div>
                <h1>Manage shop orders</h1>
                <p>View customer orders and update their status.</p>
                <div class="page-actions">
                    <button id="refresh-button" class="btn btn-outline btn-sm refresh-button" type="button">Refresh orders</button>
                </div>
            </div>

            <div id="message" class="message info" role="status" aria-live="polite" hidden></div>

            <a id="login-link" class="btn login-link" href="login.html" hidden>Go to login</a>

            <div id="orders-container" aria-busy="false">Loading orders...</div>
        </main>
    </div>

    <div class="trees" aria-hidden="true"></div>
    <footer class="site-footer">
        <div class="wrap">
            <span class="brand-name">Hadiya</span>
            <span>Gift wrapping, picked up and delivered back.</span>
        </div>
    </footer>

    <script src="config.js"></script>
    <script>renderNav('shop-orders.html');</script>
    <script>
        'use strict';

        // API_URL, ORDER_STATUS_LABELS and ORDER_NEXT_STEPS come from config.js
        // Status values must match the backend Order schema exactly
        const ORDER_STATUSES = Object.keys(ORDER_STATUS_LABELS);

        const container = document.getElementById('orders-container');
        const messageBox = document.getElementById('message');
        const loginLink = document.getElementById('login-link');
        const refreshButton = document.getElementById('refresh-button');

        let busy = false;

        function showMessage(text, type = 'info') {
            messageBox.textContent = text;
            messageBox.className = 'message ' + type;
            messageBox.hidden = false;
        }

        function clearMessage() {
            messageBox.textContent = '';
            messageBox.hidden = true;
            loginLink.hidden = true;
        }

        function setBusy(value) {
            busy = value;
            refreshButton.disabled = value;
            container.setAttribute('aria-busy', String(value));

            container.querySelectorAll('button, select').forEach(element => {
                element.disabled = value || element.dataset.locked === '1';
            });
        }

        function authenticationError(message) {
            const error = new Error(message);
            error.status = 401;
            return error;
        }

        function getToken() {
            let token;
            try {
                token = localStorage.getItem('token');
            } catch {
                throw new Error('Browser storage is unavailable. Allow site storage and log in again.');
            }

            if (!token || !token.trim() || token === 'null' || token === 'undefined') {
                throw authenticationError('You are not logged in. Please log in as a shop owner.');
            }

            return token.trim();
        }

        async function apiRequest(path, options = {}) {
            const token = getToken();
            const controller = new AbortController();

            // 60-second timeout to handle Render cold-starts
            const timeout = setTimeout(() => controller.abort(), 60000);

            try {
                const headers = {
                    Accept: 'application/json',
                    Authorization: 'Bearer ' + token
                };

                if (options.body !== undefined) {
                    headers['Content-Type'] = 'application/json';
                }

                const response = await fetch(API_URL + path, {
                    ...options,
                    headers,
                    signal: controller.signal
                });

                const text = await response.text();
                let data = null;
                let validJson = true;

                if (text.trim()) {
                    try {
                        data = JSON.parse(text);
                    } catch {
                        validJson = false;
                    }
                }

                const serverMessage =
                    data && typeof data.message === 'string'
                        ? data.message
                        : data && typeof data.error === 'string'
                            ? data.error
                            : '';

                if (!response.ok) {
                    let explanation;
                    switch (response.status) {
                        case 401:
                            explanation = 'Your session is missing, expired, or invalid. Please log in again.';
                            break;
                        case 403:
                            explanation = 'Access denied. Your account may not have the required owner role or shop access.';
                            break;
                        case 404:
                            explanation = 'The requested API route or order was not found. Check the backend order routes.';
                            break;
                        case 405:
                            explanation = 'The backend does not allow this HTTP method. Check whether the status route uses PUT or PATCH.';
                            break;
                        default:
                            explanation = response.status >= 500
                                ? 'The backend returned a server error. Check Render runtime logs.'
                                : 'The backend rejected the request.';
                    }

                    const error = new Error(
                        explanation +
                        (serverMessage ? '\nServer: ' + serverMessage : '') +
                        '\nHTTP ' + response.status + ' — ' + (options.method || 'GET') + ' ' + API_URL + path
                    );
                    error.status = response.status;
                    throw error;
                }

                if (!validJson) {
                    throw new Error('The API returned a non-JSON response. Check request URL and Render logs.');
                }

                if (data && data.success === false) {
                    throw new Error(serverMessage || 'The backend reported an unsuccessful request.');
                }

                return data;
            } catch (error) {
                if (error.name === 'AbortError') {
                    throw new Error('The request timed out after 60 seconds. Render may still be spinning up. Try refreshing.');
                }
                if (error instanceof TypeError) {
                    throw new Error('Could not connect to the API. Verify backend status and CORS settings.');
                }
                throw error;
            } finally {
                clearTimeout(timeout);
            }
        }

        function handleError(error) {
            console.error('Shop orders error:', error);
            showMessage(error.message || 'An unexpected error occurred.', 'error');
            loginLink.hidden = error.status !== 401 && error.status !== 403;
        }

        function extractOrders(data) {
            if (Array.isArray(data)) return data;
            if (data && Array.isArray(data.orders)) return data.orders;
            if (data && Array.isArray(data.data)) return data.data;
            if (data && data.data && Array.isArray(data.data.orders)) return data.data.orders;

            throw new Error('Response did not contain an orders array. Verify getShopOrders response structure.');
        }

        function displayValue(value, fallback = 'N/A') {
            if (value === null || value === undefined || value === '' || typeof value === 'object') {
                return fallback;
            }
            return String(value);
        }

        function addDetail(card, label, value) {
            const paragraph = document.createElement('p');
            const strong = document.createElement('strong');
            strong.textContent = label + ': ';
            paragraph.append(strong, document.createTextNode(displayValue(value)));
            card.appendChild(paragraph);
            return paragraph;
        }

        function formatPrice(value) {
            if (value === null || value === undefined || value === '' || !['number', 'string'].includes(typeof value)) {
                return 'N/A';
            }
            const amount = Number(value);
            return Number.isFinite(amount) ? 'AED ' + amount.toFixed(2) : 'N/A';
        }

        function renderOrders(orders) {
            const fragment = document.createDocumentFragment();

            if (orders.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'No orders found for your shop yet.';
                fragment.appendChild(empty);
            }

            orders.forEach((order, index) => {
                if (!order || typeof order !== 'object' || !order._id) {
                    throw new Error('An order in the response is missing an _id.');
                }

                const card = document.createElement('article');
                card.className = 'order-card';

                const heading = document.createElement('h2');
                heading.textContent = 'Order #' + (order.orderNumber || order._id);
                card.appendChild(heading);

                const customer = order.customer && typeof order.customer === 'object' ? order.customer : {};

                addDetail(card, 'Customer', displayValue(customer.name, 'Unknown Customer'));
                addDetail(card, 'Phone', customer.phone);
                addDetail(card, 'Total Price', formatPrice(order.pricing && order.pricing.total));
                addDetail(card, 'Service', order.service && order.service.name);

                const statusRow = addDetail(card, 'Current Status', ORDER_STATUS_LABELS[order.status] || displayValue(order.status, 'Unknown'));

                if (order.createdAt) {
                    const date = new Date(order.createdAt);
                    if (!Number.isNaN(date.getTime())) {
                        addDetail(card, 'Placed on', date.toLocaleString());
                    }
                }

                const controls = document.createElement('div');
                controls.className = 'status-controls';

                const label = document.createElement('label');
                label.textContent = 'Update status:';
                label.htmlFor = 'order-status-' + index;

                const select = document.createElement('select');
                select.id = label.htmlFor;
                select.className = 'status-select';

                const currentStatus = displayValue(order.status, '');
                const allowedNext = ORDER_NEXT_STEPS[currentStatus] || [];

                // current status first (selected), then only the steps the backend will accept
                [currentStatus, ...allowedNext].forEach(status => {
                    const option = document.createElement('option');
                    option.value = status;
                    option.textContent = (ORDER_STATUS_LABELS[status] || status) + (status === currentStatus ? ' (current)' : '');
                    option.selected = status === currentStatus;
                    select.appendChild(option);
                });

                if (allowedNext.length === 0) {
                    select.disabled = true;
                    select.dataset.locked = '1';
                }

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn-update';
                button.textContent = 'Update';

                if (allowedNext.length === 0) {
                    button.disabled = true;
                    button.dataset.locked = '1';
                }

                button.addEventListener('click', () => {
                    updateStatus(order, select, button, statusRow);
                });

                controls.append(label, select, button);
                card.appendChild(controls);
                fragment.appendChild(card);
            });

            container.replaceChildren(fragment);
        }

        async function fetchShopOrders() {
            if (busy) return;

            clearMessage();
            setBusy(true);
            container.textContent = 'Loading orders...';

            try {
                const data = await apiRequest('/orders/shop-orders');
                const orders = extractOrders(data);
                renderOrders(orders);
                showMessage(orders.length + ' order' + (orders.length === 1 ? '' : 's') + ' loaded.', 'success');
            } catch (error) {
                container.textContent = 'Orders could not be loaded.';
                handleError(error);
            } finally {
                setBusy(false);
            }
        }

        async function updateStatus(order, select, button, statusRow) {
            if (busy) return;

            const newStatus = select.value;
            clearMessage();

            if (!ORDER_STATUSES.includes(newStatus)) {
                showMessage('Please choose a valid status.', 'error');
                return;
            }

            if (newStatus === order.status) {
                showMessage('This order already has that status.', 'info');
                return;
            }

            if ((newStatus === 'cancelled' || newStatus === 'rejected') && !window.confirm('Are you sure? This cannot be undone.')) {
                return;
            }

            setBusy(true);
            button.textContent = 'Updating...';

            try {
                await apiRequest('/orders/' + encodeURIComponent(order._id) + '/status', {
                    method: 'PUT',
                    body: JSON.stringify({ status: newStatus })
                });

                showMessage('Order status updated successfully.', 'success');
                busy = false;
                await fetchShopOrders();
                showMessage('Order status updated successfully.', 'success');
                return;
            } catch (error) {
                handleError(error);
            } finally {
                button.textContent = 'Update';
                setBusy(false);
            }
        }

        refreshButton.addEventListener('click', fetchShopOrders);
        fetchShopOrders();
    </script>
</body>
</html>
