<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrapIt | Sign In</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #7c3aed;
            --secondary: #ec4899;
            --dark: #21163e;
            --text: #514967;
            --muted: #817891;
            --cream: #fffaf5;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
            background:
                radial-gradient(circle at 90% 5%, #f5d8ef, transparent 28%),
                radial-gradient(circle at 5% 90%, #e6dcff, transparent 30%),
                var(--cream);
            font-family: "DM Sans", sans-serif;
        }

        body.arabic {
            font-family: "Noto Kufi Arabic", sans-serif;
        }

        .container {
            width: min(100%, 1000px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border-radius: 28px;
            background: var(--white);
            box-shadow: 0 25px 70px #4c27751f;
        }

        .welcome-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            background: linear-gradient(145deg, var(--primary), var(--secondary));
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 70px;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .logo-mark {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            border-radius: 12px;
            color: var(--primary);
            background: white;
        }

        .welcome-panel h1 {
            margin-bottom: 18px;
            font-family: "Playfair Display", serif;
            font-size: 3.2rem;
            line-height: 1.1;
        }

        body.arabic .welcome-panel h1 {
            font-family: "Noto Kufi Arabic", sans-serif;
            font-size: 2.5rem;
            line-height: 1.45;
        }

        .welcome-panel p {
            max-width: 360px;
            color: #ffffffd9;
            line-height: 1.8;
        }

        .login-panel {
            padding: 60px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .top-row a {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .language-button {
            padding: 8px 12px;
            border: 1px solid #dfd2f3;
            border-radius: 8px;
            color: var(--primary);
            background: white;
            cursor: pointer;
            font: inherit;
            font-size: 0.8rem;
        }

        .login-panel h2 {
            margin-bottom: 10px;
            color: var(--dark);
            font-size: 2rem;
        }

        .subtitle {
            margin-bottom: 30px;
            color: var(--muted);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .field {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #e4dced;
            border-radius: 10px;
            outline: none;
            color: var(--dark);
            font: inherit;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px #7c3aed14;
        }

        .password-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-password {
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .submit-button {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .register-text {
            margin-top: 28px;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }

        .register-text a {
            color: var(--primary);
            font-weight: 700;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                padding: 35px;
            }

            .logo {
                margin-bottom: 35px;
            }

            .welcome-panel h1 {
                font-size: 2.5rem;
            }

            .login-panel {
                padding: 35px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="welcome-panel">
            <a href="index.html" class="logo">
                <span class="logo-mark">🎁</span>
                <span>WrapIt</span>
            </a>

            <h1 data-en="Welcome back." data-ar="مرحباً بعودتك.">
                Welcome back.
            </h1>

            <p data-en="Sign in to manage your bookings and discover beautiful gift-wrapping services."
               data-ar="سجّل الدخول لإدارة حجوزاتك واكتشاف أجمل خدمات تغليف الهدايا.">
                Sign in to manage your bookings and discover beautiful gift-wrapping services.
            </p>
        </section>

        <section class="login-panel">
            <div class="top-row">
                <a href="index.html" data-en="← Home" data-ar="→ الرئيسية">← Home</a>

                <button class="language-button" id="languageButton">
                    العربية
                </button>
            </div>

            <h2 data-en="Sign in" data-ar="تسجيل الدخول">Sign in</h2>

            <p class="subtitle"
               data-en="Enter your details to continue."
               data-ar="أدخل بياناتك للمتابعة.">
                Enter your details to continue.
            </p>

            <form id="loginForm">
                <div class="field">
                    <label for="email" data-en="Email address" data-ar="البريد الإلكتروني">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="you@example.com"
                    >
                </div>

                <div class="field">
                    <div class="password-row">
                        <label for="password" data-en="Password" data-ar="كلمة المرور">
                            Password
                        </label>

                        <a href="#" class="forgot-password"
                           data-en="Forgot password?"
                           data-ar="نسيت كلمة المرور؟">
                            Forgot password?
                        </a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        required
                        placeholder="••••••••"
                    >
                </div>

                <button class="submit-button" type="submit"
                        data-en="Sign in"
                        data-ar="تسجيل الدخول">
                    Sign in
                </button>

            </form>
	
            <p class="register-text">
                <span data-en="Don't have an account?"
                      data-ar="ليس لديك حساب؟">
                    Don't have an account?
                </span>

                <a href="register.html"
                   data-en="Create one"
                   data-ar="أنشئ حساباً">
                    Create one
                </a>
            </p>
        </section>
    </div>

    <script src="config.js"></script>
    <script>
        const languageButton = document.getElementById("languageButton");
    const loginForm = document.getElementById("loginForm");

    let currentLanguage = localStorage.getItem("language") || "en";

    function applyLanguage() {
        document.documentElement.lang = currentLanguage;
        document.documentElement.dir =
            currentLanguage === "ar" ? "rtl" : "ltr";

        document.body.classList.toggle(
            "arabic",
            currentLanguage === "ar"
        );

        document.querySelectorAll("[data-en]").forEach(element => {
            element.textContent = element.dataset[currentLanguage];
        });

        languageButton.textContent =
            currentLanguage === "en" ? "العربية" : "English";
    }

    languageButton.addEventListener("click", () => {
        currentLanguage = currentLanguage === "en" ? "ar" : "en";

        localStorage.setItem("language", currentLanguage);

        applyLanguage();
    });
loginForm.addEventListener("submit", async event => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const response = await fetch(
            API_URL + "/auth/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login failed");
        }

        if (!data.token) {
            throw new Error("Login failed");
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user || {}));

        // go back to where the person was heading, otherwise by account type
        const next = safeNext(new URLSearchParams(location.search).get("next"));
        const role = data.user && data.user.role;
        window.location.href = next ||
            (role === "shop_owner" || role === "admin" ? "shop-owner-dashboard.html" : "shops.html");

    } catch (error) {
        alert(
            currentLanguage === "en"
                ? error.message
                : "فشل تسجيل الدخول. تحقق من بياناتك وحاول مرة أخرى."
        );
    }
});

    applyLanguage();
</script>
  </body>
</html>
