<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E1624">
    <title>Sign In - Hadiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Italiana&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>

        body { display: flex; flex-direction: column; }
        .auth { flex: 1; display: flex; align-items: center; justify-content: center; padding: 34px 20px 10px; }
        .container {
            width: min(100%, 1000px); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
            border-radius: 28px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 25px 60px rgba(70, 40, 20, 0.2);
        }
        .welcome-panel { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 56px; color: var(--on-wine); background: var(--wine); overflow: hidden; }
        .welcome-panel .brand-name { color: var(--on-wine); }
        .welcome-panel .brand-mark { background: var(--sand); }
        .welcome-panel .brand-mark svg { stroke: var(--wine); }
        .welcome-panel .brand { margin-bottom: 60px; }
        .welcome-panel h1 { color: var(--on-wine); margin-bottom: 18px; font-size: 3.4rem; }
        body.arabic .welcome-panel h1 { font-size: 2.5rem; line-height: 1.5; }
        .welcome-panel p { max-width: 360px; color: #E4CFC4; line-height: 1.8; position: relative; }
        .welcome-panel .branch { position: absolute; right: -30px; bottom: -20px; width: 260px; opacity: 0.35; }
        .login-panel { padding: 56px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .top-row a { color: var(--wine); font-size: 0.92rem; font-weight: 700; }
        .login-panel h2 { margin-bottom: 8px; font-size: 2.6rem; }
        .subtitle { margin-bottom: 28px; color: var(--muted); }
        .field { margin-bottom: 20px; }
        .password-row { display: flex; justify-content: space-between; align-items: center; }
        .forgot-password { color: var(--wine); font-size: 0.8rem; font-weight: 700; }
        .submit-button { width: 100%; margin-top: 10px; }
        .register-text { margin-top: 26px; color: var(--muted); text-align: center; font-size: 0.92rem; }
        .register-text a { color: var(--wine); font-weight: 800; }
        @media (max-width: 750px) {
            .container { grid-template-columns: 1fr; }
            .welcome-panel, .login-panel { padding: 34px; }
            .welcome-panel .brand { margin-bottom: 30px; }
            .welcome-panel h1 { font-size: 2.6rem; }
        }

    </style>
</head>
<body>
    <div class="awning"></div>
    <div class="auth">
    <div class="container">
        <section class="welcome-panel">
            <a href="index.html" class="brand">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/></svg></span>
                <span class="brand-name" data-en="Hadiya" data-ar="هدية">Hadiya</span>
            </a>

            <h1 data-en="Welcome back." data-ar="مرحباً بعودتك.">Welcome back.</h1>

            <p data-en="Sign in to manage your bookings and discover beautiful gift-wrapping services."
               data-ar="سجّل الدخول لإدارة حجوزاتك واكتشاف أجمل خدمات تغليف الهدايا.">
                Sign in to manage your bookings and discover beautiful gift-wrapping services.
            </p>
            <svg class="branch" viewBox="0 0 260 200" aria-hidden="true"><path d="M250 20 C190 40 120 80 60 190" fill="none" stroke="#E4CFC4" stroke-width="3" stroke-linecap="round"/><g fill="#E4CFC4"><ellipse cx="215" cy="42" rx="22" ry="8" transform="rotate(-20 215 42)"/><ellipse cx="190" cy="74" rx="22" ry="8" transform="rotate(35 190 74)"/><ellipse cx="160" cy="68" rx="22" ry="8" transform="rotate(-25 160 68)"/><ellipse cx="140" cy="102" rx="22" ry="8" transform="rotate(40 140 102)"/><ellipse cx="108" cy="104" rx="22" ry="8" transform="rotate(-30 108 104)"/><ellipse cx="92" cy="140" rx="22" ry="8" transform="rotate(45 92 140)"/><ellipse cx="62" cy="144" rx="22" ry="8" transform="rotate(-40 62 144)"/></g></svg>
        </section>

        <section class="login-panel">
            <div class="top-row">
                <a href="index.html" data-en="← Home" data-ar="→ الرئيسية">← Home</a>
                <button class="lang-btn" id="languageButton" type="button">العربية</button>
            </div>

            <h2 data-en="Sign in" data-ar="تسجيل الدخول">Sign in</h2>
            <p class="subtitle" data-en="Enter your details to continue." data-ar="أدخل بياناتك للمتابعة.">Enter your details to continue.</p>

            <form id="loginForm">
                <div class="field">
                    <label for="email" data-en="Email address" data-ar="البريد الإلكتروني">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="you@example.com"
                    >
                </div>

                <div class="field">
                    <div class="password-row">
                        <label for="password" data-en="Password" data-ar="كلمة المرور">
                            Password
                        </label>

                        <a href="#" class="forgot-password"
                           data-en="Forgot password?"
                           data-ar="نسيت كلمة المرور؟">
                            Forgot password?
                        </a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        required
                        placeholder="••••••••"
                    >
                </div>

                <button class="btn submit-button" type="submit"
                        data-en="Sign in"
                        data-ar="تسجيل الدخول">
                    Sign in
                </button>

            </form>

            <p class="register-text">
                <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span>
                <a href="register.html" data-en="Create one" data-ar="أنشئ حساباً">Create one</a>
            </p>
        </section>
    </div>
    </div>
    <div class="trees" aria-hidden="true" style="margin-top:30px"></div>

    <script src="config.js"></script>
    <script>
        const languageButton = document.getElementById("languageButton");
    const loginForm = document.getElementById("loginForm");

    let currentLanguage = localStorage.getItem("language") || "en";

    function applyLanguage() {
        document.documentElement.lang = currentLanguage;
        document.documentElement.dir =
            currentLanguage === "ar" ? "rtl" : "ltr";

        document.body.classList.toggle(
            "arabic",
            currentLanguage === "ar"
        );

        document.querySelectorAll("[data-en]").forEach(element => {
            element.textContent = element.dataset[currentLanguage];
        });

        languageButton.textContent =
            currentLanguage === "en" ? "العربية" : "English";
    }

    languageButton.addEventListener("click", () => {
        currentLanguage = currentLanguage === "en" ? "ar" : "en";

        localStorage.setItem("language", currentLanguage);

        applyLanguage();
    });
loginForm.addEventListener("submit", async event => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const response = await fetch(
            API_URL + "/auth/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login failed");
        }

        if (!data.token) {
            throw new Error("Login failed");
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user || {}));

        // go back to where the person was heading, otherwise by account type
        const next = safeNext(new URLSearchParams(location.search).get("next"));
        const role = data.user && data.user.role;
        window.location.href = next ||
            (role === "shop_owner" || role === "admin" ? "shop-owner-dashboard.html" : "shops.html");

    } catch (error) {
        alert(
            currentLanguage === "en"
                ? error.message
                : "فشل تسجيل الدخول. تحقق من بياناتك وحاول مرة أخرى."
        );
    }
});

    applyLanguage();
</script>
  </body>
</html>
