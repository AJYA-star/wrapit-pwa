<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E1624">
    <title>My Orders - Hadiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Italiana&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>

        .banner { margin-bottom: 16px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .order-id { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
        .shop-name { font-family: var(--serif); font-weight: 700; font-size: 1.7rem; color: var(--head); line-height: 1.1; }
        .service-name { color: var(--ink-2); margin: 4px 0 8px; font-weight: 700; }
        .meta { color: var(--muted); font-size: 0.88rem; margin: 3px 0; }
        .total { margin-top: 8px; font-family: var(--script); font-weight: 700; font-size: 1.9rem; color: var(--wine); text-align: right; }
        .actions { margin-top: 8px; text-align: right; }
        .cancel-btn { background: transparent; color: var(--wine); border: 1.5px solid var(--wine); padding: 8px 18px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 700; }
        .cancel-btn:hover { background: var(--wine); color: var(--on-wine); }
        .cancel-btn:disabled { opacity: 0.5; }
        .no-orders { text-align: center; padding: 50px 10px; color: var(--muted); font-weight: 700; }
        .no-orders a { color: var(--wine); font-weight: 800; text-decoration: underline; }

    </style>
</head>
<body>
    <div class="awning"></div>
    <div class="wrap">
        <header class="topbar">
            <a href="index.html" class="brand">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/></svg></span>
                <span class="brand-name">Hadiya</span>
            </a>
            <nav class="nav" id="siteNav"></nav>
        </header>

        <div class="page-head">
            <div class="script">your table</div>
            <h1>My orders</h1>
            <p>Follow your gifts from pickup to delivery.</p>
        </div>

        <div style="max-width:800px; margin-top:18px">
            <div class="banner" id="placedBanner" hidden>🎉 Order placed! The shop will confirm it shortly.</div>
            <div id="ordersList"><p class="loading">Loading your orders...</p></div>
        </div>
    </div>

    <div class="trees" aria-hidden="true"></div>
    <footer class="site-footer">
        <div class="wrap">
            <span class="brand-name">Hadiya</span>
            <span>Gift wrapping, picked up and delivered back.</span>
        </div>
    </footer>

    <script src="config.js"></script>
    <script>renderNav('my-orders.html');</script>
    <script>
        const list = document.getElementById('ordersList');

        if (new URLSearchParams(location.search).get('placed')) {
            document.getElementById('placedBanner').hidden = false;
        }

        function money(n) { return 'AED ' + Number(n || 0); }

        function render(orders) {
            if (!orders.length) {
                list.innerHTML = '<div class="no-orders">No orders found yet. <a href="shops.html">Time to wrap some gifts!</a></div>';
                return;
            }

            list.innerHTML = orders.map(order => {
                const status = order.status;
                const label = ORDER_STATUS_LABELS[status] || status;
                const pickup = order.pickupDetails || {};
                const delivery = order.deliveryDetails || {};
                const pickupText = pickup.type === 'shop_pickup' ? 'Shop picks up from: ' + (pickup.address || '') : 'You drop off at the shop';
                const deliveryText = delivery.type === 'shop_delivery' ? 'Delivered to: ' + (delivery.address || '') : 'You collect from the shop';
                const date = order.createdAt ? new Date(order.createdAt).toLocaleString() : '';

                return `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">#${esc(order.orderNumber)}</span>
                        <span class="status status-${esc(status)}">${esc(label)}</span>
                    </div>
                    <div class="shop-name">${esc(order.shop ? order.shop.name : 'Unknown Shop')}</div>
                    <div class="service-name">${esc(order.service ? order.service.name : '')}</div>
                    <div class="meta">📥 ${esc(pickupText)}</div>
                    <div class="meta">📤 ${esc(deliveryText)}</div>
                    ${date ? `<div class="meta">🕒 Placed ${esc(date)}</div>` : ''}
                    <div class="total">${esc(money(order.pricing && order.pricing.total))}</div>
                    ${status === 'pending' ? `<div class="actions"><button class="cancel-btn" data-id="${esc(order._id)}">Cancel order</button></div>` : ''}
                </div>`;
            }).join('');

            list.querySelectorAll('.cancel-btn').forEach(btn => btn.addEventListener('click', () => cancelOrder(btn)));
        }

        async function cancelOrder(button) {
            if (!confirm('Cancel this order?')) return;
            button.disabled = true;
            try {
                await api('/orders/' + encodeURIComponent(button.dataset.id) + '/cancel', { method: 'PUT', body: {} });
                fetchOrders();
            } catch (err) {
                alert(err.message);
                button.disabled = false;
            }
        }

        async function fetchOrders() {
            if (!getToken()) {
                list.innerHTML = '<div class="no-orders">Please <a href="login.html?next=my-orders.html">log in</a> to see your orders.</div>';
                return;
            }
            try {
                const data = await api('/orders/my-orders');
                render(data.orders || []);
            } catch (err) {
                if (err.status === 401) {
                    list.innerHTML = '<div class="no-orders">Your session has expired. Please <a href="login.html?next=my-orders.html">log in</a> again.</div>';
                } else {
                    list.innerHTML = `<div class="no-orders">${esc(err.message)}</div>`;
                }
            }
        }

        fetchOrders();
    </script>
</body>
</html>
