<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E1624">
    <title>Order chat - Hadiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Italiana&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        .back { display: inline-block; margin: 6px 0 14px; font-weight: 700; color: var(--wine); }
        .back:hover { text-decoration: underline; }

        .chat-card { max-width: 760px; padding: 0; overflow: hidden; }
        .chat-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
        .chat-head h1 { font-size: 1.9rem; }
        .chat-head .sub { color: var(--ink-2); font-size: 0.92rem; margin-top: 4px; }
        .chat-head .order-id { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }

        .messages { height: min(55vh, 520px); overflow-y: auto; padding: 18px 18px 8px; background: var(--bg-2); display: flex; flex-direction: column; gap: 10px; }
        .empty-chat { margin: auto; text-align: center; color: var(--muted); font-weight: 700; padding: 20px; }

        .msg { max-width: 78%; padding: 10px 14px 8px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.45; }
        .msg .who { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; opacity: 0.75; margin-bottom: 2px; white-space: normal; }
        .msg .time { display: block; font-size: 0.7rem; opacity: 0.7; margin-top: 4px; text-align: right; white-space: normal; }
        .msg.mine { align-self: flex-end; background: var(--wine); color: var(--on-wine); border-bottom-right-radius: 6px; }
        .msg.theirs { align-self: flex-start; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-bottom-left-radius: 6px; }

        .composer { display: flex; gap: 10px; align-items: flex-end; padding: 14px 18px 18px; border-top: 1px solid var(--line); }
        .composer textarea { flex: 1; min-height: 46px; max-height: 140px; resize: none; border-radius: 16px; }
        .composer .btn { flex-shrink: 0; }
        .chat-error { margin: 0 18px 12px; }
        .hint { padding: 0 18px 14px; color: var(--muted); font-size: 0.8rem; }
        .center-note { text-align: center; padding: 50px 10px; color: var(--muted); font-weight: 700; }
        .center-note a { color: var(--wine); font-weight: 800; text-decoration: underline; }
        @media (max-width: 640px) {
            .msg { max-width: 90%; }
            .chat-head { padding: 14px 16px; }
            .chat-head > div:last-child { text-align: left !important; }
            .messages { height: min(50vh, 420px); }
        }
    </style>
</head>
<body>
    <div class="awning"></div>
    <div class="wrap">
        <header class="topbar">
            <a href="index.html" class="brand">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/></svg></span>
                <span class="brand-name">Hadiya</span>
            </a>
            <nav class="nav" id="siteNav"></nav>
        </header>

        <a class="back" id="backLink" href="my-orders.html">&larr; Back to orders</a>

        <div id="notice" class="center-note" hidden></div>

        <section class="card chat-card" id="chatCard" hidden>
            <div class="chat-head">
                <div>
                    <h1 id="chatTitle">Chat</h1>
                    <div class="sub" id="chatSub"></div>
                </div>
                <div style="text-align:right">
                    <span class="status" id="chatStatus"></span>
                    <div class="order-id" id="chatOrderId"></div>
                </div>
            </div>

            <div class="messages" id="messages" aria-live="polite"></div>
            <div class="notice error chat-error" id="chatError" hidden></div>

            <form class="composer" id="composer">
                <textarea id="text" rows="1" maxlength="1000" placeholder="Write a message..." aria-label="Message"></textarea>
                <button class="btn" type="submit" id="sendBtn">Send</button>
            </form>
            <div class="hint">Please keep your messages about this order. Press Enter to send, Shift+Enter for a new line.</div>
        </section>
    </div>

    <div class="trees" aria-hidden="true"></div>
    <footer class="site-footer">
        <div class="wrap">
            <span class="brand-name">Hadiya</span>
            <span>Gift wrapping, picked up and delivered back.</span>
        </div>
    </footer>

    <script src="config.js"></script>
    <script>renderNav('chat.html');</script>
    <script>
        const $ = id => document.getElementById(id);
        const orderId = new URLSearchParams(location.search).get('order');
        const POLL_MS = 4000;

        let side = null;          // 'customer' or 'shop' (told by the server)
        let lastTime = null;      // createdAt of the newest message we have
        const seen = new Set();   // message ids already on screen
        let timer = null;
        let loading = false;

        function showNotice(html) {
            $('chatCard').hidden = true;
            $('notice').innerHTML = html;
            $('notice').hidden = false;
        }

        function showError(text) {
            $('chatError').textContent = text;
            $('chatError').hidden = !text;
        }

        function timeText(value) {
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return '';
            const today = new Date();
            const sameDay = d.toDateString() === today.toDateString();
            return sameDay
                ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function nearBottom() {
            const box = $('messages');
            return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        }

        function addMessages(list) {
            const box = $('messages');
            const stick = nearBottom();
            let added = false;

            list.forEach(m => {
                if (!m || seen.has(m._id)) return;
                seen.add(m._id);
                added = true;
                if (!lastTime || new Date(m.createdAt) > new Date(lastTime)) lastTime = m.createdAt;

                const empty = box.querySelector('.empty-chat');
                if (empty) empty.remove();

                const mine = m.senderRole === side;
                const div = document.createElement('div');
                div.className = 'msg ' + (mine ? 'mine' : 'theirs');

                const who = document.createElement('span');
                who.className = 'who';
                who.textContent = mine ? 'You' : (m.senderName || (m.senderRole === 'shop' ? 'Shop' : 'Customer'));
                const body = document.createElement('span');
                body.textContent = m.text;                 // textContent: nothing typed can inject HTML
                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = timeText(m.createdAt);

                div.append(who, body, time);
                box.appendChild(div);
            });

            if (!box.children.length) {
                const p = document.createElement('div');
                p.className = 'empty-chat';
                p.textContent = 'No messages yet. Say hello! 👋';
                box.appendChild(p);
            }
            if (added && stick) box.scrollTop = box.scrollHeight;
            return added;
        }

        async function loadOrder() {
            const data = await api('/orders/' + encodeURIComponent(orderId));
            const o = data.order;
            const isShop = side === 'shop';
            const otherName = isShop ? (o.customer && o.customer.name) : (o.shop && o.shop.name);
            $('chatTitle').textContent = 'Chat with ' + (otherName || (isShop ? 'the customer' : 'the shop'));
            $('chatSub').textContent = (o.service && o.service.name) || '';
            $('chatStatus').textContent = ORDER_STATUS_LABELS[o.status] || o.status;
            $('chatStatus').className = 'status status-' + o.status;
            $('chatOrderId').textContent = '#' + (o.orderNumber || '');
        }

        async function poll(first) {
            if (loading) return;
            loading = true;
            try {
                const path = '/orders/' + encodeURIComponent(orderId) + '/messages' +
                    (lastTime && !first ? '?after=' + encodeURIComponent(lastTime) : '');
                const data = await api(path);
                if (first) {
                    side = data.side;
                    $('backLink').href = side === 'shop' ? 'shop-owner-dashboard.html' : 'my-orders.html';
                    await loadOrder();
                    $('notice').hidden = true;
                    $('chatCard').hidden = false;
                }
                const added = addMessages(data.messages || []);
                if (first && !added) addMessages([]);   // shows the "say hello" note
                showError('');
            } catch (err) {
                if (first) {
                    if (err.status === 401) {
                        showNotice('Please <a href="login.html?next=' + encodeURIComponent('chat.html?order=' + orderId) + '">log in</a> to see this chat.');
                    } else if (err.status === 403 || err.status === 404) {
                        showNotice('This chat is not available. It may belong to a different account.');
                    } else {
                        showNotice(esc(err.message));
                    }
                    stop();
                } else if (err.status === 401) {
                    showError('Your session has expired. Please log in again.');
                    stop();
                }
                /* other errors while refreshing: stay quiet, the next refresh tries again */
            }
            loading = false;
        }

        function start() { stop(); timer = setInterval(() => { if (!document.hidden) poll(false); }, POLL_MS); }
        function stop() { if (timer) clearInterval(timer); timer = null; }
        document.addEventListener('visibilitychange', () => { if (!document.hidden && timer) poll(false); });

        async function send() {
            const input = $('text');
            const text = input.value.trim();
            if (!text) return;
            const btn = $('sendBtn');
            btn.disabled = true;
            showError('');
            try {
                const data = await api('/orders/' + encodeURIComponent(orderId) + '/messages', { method: 'POST', body: { text } });
                input.value = '';
                input.style.height = '';
                addMessages([data.message]);
                $('messages').scrollTop = $('messages').scrollHeight;
            } catch (err) {
                showError(err.message);
            }
            btn.disabled = false;
            input.focus();
        }

        $('composer').addEventListener('submit', e => { e.preventDefault(); send(); });
        $('text').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
        $('text').addEventListener('input', e => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
        });

        if (!orderId) {
            showNotice('No order selected. Open a chat from <a href="my-orders.html">your orders</a>.');
        } else if (!getToken()) {
            showNotice('Please <a href="login.html?next=' + encodeURIComponent('chat.html?order=' + orderId) + '">log in</a> to see this chat.');
        } else {
            poll(true).then(() => { if (side) start(); });
        }
    </script>
</body>
</html>
