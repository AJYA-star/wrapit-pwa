<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <title>Browse Shops - WrapIt</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: 'Montserrat', sans-serif; 
        background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        min-height: 100vh;
        padding: 20px; 
    }
    .header { 
        background: white;
        color: #f5576c; 
        padding: 25px; 
        border-radius: 20px; 
        margin-bottom: 25px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        box-shadow: 0 10px 30px rgba(245, 87, 108, 0.15);
    }
    .header h1 { 
        font-size: 2em; 
        font-weight: 700;
    }
    .back-btn { 
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white; 
        border: none; 
        padding: 12px 24px; 
        border-radius: 12px; 
        cursor: pointer; 
        font-weight: 600;
        box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
        transition: 0.3s;
    }
    .back-btn:hover { 
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
    }
    .search-box { margin-bottom: 25px; }
    .search-box input { 
        width: 100%; 
        padding: 16px; 
        border: 2px solid #f5576c40; 
        border-radius: 15px; 
        font-size: 1em;
        background: white;
        box-shadow: 0 5px 20px rgba(245, 87, 108, 0.1);
        transition: 0.3s;
    }
    .search-box input:focus {
        outline: none;
        border-color: #f5576c;
        box-shadow: 0 5px 25px rgba(245, 87, 108, 0.2);
    }
    .shops-container { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
        gap: 25px; 
    }
    .shop-card { 
        background: white; 
        border-radius: 20px; 
        overflow: hidden; 
        box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        cursor: pointer; 
        transition: 0.3s; 
    }
    .shop-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 40px rgba(245, 87, 108, 0.2);
    }
    .shop-info { padding: 20px; }
    .shop-name { font-size: 1.2em; font-weight: 700; color: #2d3436; margin-bottom: 6px; }
    .shop-rating, .shop-price { margin-top: 8px; color: #636e72; font-size: 0.9em; }
    .loading { text-align: center; padding: 40px; color: #636e72; font-weight: 600; }
    @media (max-width: 600px) {
        body { padding: 12px; }
        .header { flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px; }
        .header h1 { font-size: 1.5em; }
        .back-btn { width: 100%; }
        .shops-container { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
    <div class="header">
        <h1>🎁 Browse Shops</h1>
        <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search shops by name or city..." onkeyup="filterShops()">
    </div>

    <div id="loadingMessage" class="loading">Loading shops...</div>
    <div id="shopsContainer" class="shops-container"></div>

    <script src="config.js"></script>
    <script>
        let allShops = [];

        const container = document.getElementById('shopsContainer');
        const loading = document.getElementById('loadingMessage');

        async function loadShops() {
            try {
                const data = await api('/shops');
                allShops = data.shops || [];
                displayShops(allShops);
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            }
        }

        function displayShops(shops) {
            loading.style.display = 'none';

            if (shops.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #636e72;">No shops found yet. Please check back soon!</p>';
                return;
            }

            container.innerHTML = shops.map(shop => {
                const rating = shop.rating && shop.rating.average ? Number(shop.rating.average).toFixed(1) : 'New';
                const count = shop.rating ? shop.rating.count || 0 : 0;
                const prices = (shop.services || []).filter(s => s.isAvailable !== false).map(s => Number(s.price));
                const fromPrice = prices.length ? 'AED ' + Math.min(...prices) : 'See shop';
                const city = shop.address && shop.address.city ? shop.address.city : '';
                const image = shop.images && shop.images[0] && /^https?:\/\//i.test(shop.images[0])
                    ? shop.images[0]
                    : 'https://images.unsplash.com/photo-1513201099705-a9746e1e201f?auto=format&fit=crop&w=400&q=80';

                return `
                <div class="shop-card" onclick="goToShopDetail('${esc(shop._id)}')">
                    <div class="shop-image" style="height:180px; background-image: url('${esc(image)}'); background-size: cover; background-position: center;"></div>
                    <div class="shop-info">
                        <div class="shop-name">${esc(shop.name)}</div>
                        <div class="shop-location" style="color:#888; font-size:0.85em; margin-top:4px;">${city ? '📍 ' + esc(city) : ''}</div>
                        <div class="shop-rating">
                            <span style="color:#fab1a0">★</span> ${esc(rating)}
                            <span style="color:#b2bec3; font-size:0.8em;">(${esc(count)} reviews)</span>
                        </div>
                        <div class="shop-price">Starting from <span style="color:#2d3436">${esc(fromPrice)}</span></div>
                    </div>
                </div>`;
            }).join('');
        }

        function filterShops() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            displayShops(allShops.filter(shop =>
                (shop.name || '').toLowerCase().includes(term) ||
                ((shop.address && shop.address.city) || '').toLowerCase().includes(term)
            ));
        }

        function goToShopDetail(shopId) {
            window.location.href = 'shop-detail.html?id=' + encodeURIComponent(shopId);
        }

        function showError(message) {
            loading.style.display = 'none';
            container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #c0392b;">${esc(message)}</p>`;
        }

        loadShops();
    </script>
</body>
</html>
